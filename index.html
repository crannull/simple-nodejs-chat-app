<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        #chat-container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #messages { height: 300px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fafafa; }
        .message { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; background: #e2f0cb; width: fit-content; max-width: 80%; }
        #input-container { display: flex; gap: 10px; }
        #message-input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; border: none; background: #007bff; color: white; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>Simple Chat Room</h2>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    // Connect to the WebSocket server dynamically based on the current window host
 //   const socket = new WebSocket(`ws://${window.location.host}`);
 
    // Replace the old socket line with this one:
const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const socket = new WebSocket(`${protocol}//${window.location.host}`);


    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    // Receive message from server and display it
    socket.addEventListener('message', (event) => {
        const msgElement = document.createElement('div');
        msgElement.classList.add('message');
        msgElement.textContent = event.data;
        messagesDiv.appendChild(msgElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll to the bottom
    });

    // Function to send message
    function sendMessage() {
        const text = messageInput.value.trim();
        if (text !== '') {
            socket.send(text); // Send data to server
            messageInput.value = ''; // Clear input field
        }
    }

    // Trigger send on button click
    sendBtn.addEventListener('click', sendMessage);

    // Trigger send on pressing 'Enter' key
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
